name: Install smoke test

# Executes the README quickstart verbatim on each supported OS: install the
# plugin from this checkout, then `psalm-laravel init`, `analyze`, and
# `diagnose`. Runs against two target kinds (matrix `kind`): a fresh Laravel
# `app`, and a real Laravel `package` (socialite) whose src/-autoload config path
# and Testbench plugin-boot fallback the app flow never exercises (#1198).
#
# Complements test-laravel-app.yml (which is Ubuntu-only and covers a PHP x
# Laravel compatibility matrix on a heavily scaffolded app) by covering
# OS-specific install/configuration behavior on minimal targets — the class of
# bug fixed in #1189, where a Windows proc_open() launcher regression could pass
# every Ubuntu-only check.

# Weekly, not per-PR: the matrix needs six cross-OS runners for a check that only
# moves when the installer, the CLI, or the quickstart in the README changes. A
# schedule only ever fires on the default branch, so the maintained release lines
# are covered by checking each one out explicitly (matrix `ref`).
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1' # Mondays, 05:23 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install-smoke:
    # Explicit include rows (rather than a ref x os x kind cross-product) keep
    # `runs-on: ${{ matrix.runner }}` statically resolvable to a concrete Blacksmith
    # label — lint-workflows.yml's octoscan step ignores the runner-label warning by
    # label, which a nested `matrix.os.runner` would turn into an unresolvable
    # expression and trip as a self-hosted-runner alert.
    name: Install smoke (${{ matrix.ref }} / ${{ matrix.name }}${{ matrix.kind == 'package' && ' / package' || '' }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: master
            name: Ubuntu
            runner: blacksmith-2vcpu-ubuntu-2404
            kind: app
          - ref: master
            name: Ubuntu
            runner: blacksmith-2vcpu-ubuntu-2404
            kind: package
          - ref: master
            name: Windows
            runner: blacksmith-2vcpu-windows-2025
            kind: app
          - ref: master
            name: Windows
            runner: blacksmith-2vcpu-windows-2025
            kind: package
          - ref: master
            name: macOS
            runner: blacksmith-6vcpu-macos-15
            kind: app
          - ref: master
            name: macOS
            runner: blacksmith-6vcpu-macos-15
            kind: package
          - ref: '3.x'
            name: Ubuntu
            runner: blacksmith-2vcpu-ubuntu-2404
            kind: app
          - ref: '3.x'
            name: Ubuntu
            runner: blacksmith-2vcpu-ubuntu-2404
            kind: package
          - ref: '3.x'
            name: Windows
            runner: blacksmith-2vcpu-windows-2025
            kind: app
          - ref: '3.x'
            name: Windows
            runner: blacksmith-2vcpu-windows-2025
            kind: package
          - ref: '3.x'
            name: macOS
            runner: blacksmith-6vcpu-macos-15
            kind: app
          - ref: '3.x'
            name: macOS
            runner: blacksmith-6vcpu-macos-15
            kind: package
    runs-on: ${{ matrix.runner }}
    steps:
      # NOTE: step-security/harden-runner is intentionally NOT used here.
      # It only supports Linux runners; on Windows/macOS its post-step fails
      # (ENOENT post_event.json) and takes the whole job down. A step-level
      # `if: runner.os == 'Linux'` does not help — an action's pre/post hooks
      # run on the job lifecycle regardless of the step's `if`, so the post
      # still fires and fails. Keeping it Linux-only would mean splitting this
      # into two near-duplicate jobs; not worth it for an audit-only egress
      # log on a workflow whose network surface is just Composer, Packagist,
      # and GitHub. The blocking egress policy lives on the analysis workflows.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scheduled run always starts from the default branch; each release
          # line is smoke-tested against its own tree, installer script included.
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.4'
          coverage: none
          # fileinfo: required transitively by laravel/framework (via
          # league/flysystem-local) and not enabled by default on the Windows
          # PHP build. Ubuntu/macOS bundle it, but the shared setup keeps the
          # matrix identical.
          extensions: fileinfo

      - name: Install plugin repo dependencies (install-smoke.php itself needs symfony/process)
        # --no-blocking: a security advisory against one of the plugin's own dev
        # deps shouldn't fail every run of this workflow with an unrelated error.
        run: composer install --prefer-dist --no-progress --no-interaction --no-blocking

      - name: Run install smoke test
        # APP_DIR is set here (step-level env), not job-level: the `runner`
        # context isn't available in a job-level `env:` block. Passing it as an
        # env value (rather than writing $GITHUB_ENV, or templating into the
        # run: script) keeps it clear of both shell-injection and $GITHUB_ENV
        # write concerns.
        env:
          APP_DIR: ${{ runner.temp }}/psalm-install-smoke
          PROJECT_KIND: ${{ matrix.kind }}
        run: php bin/ci/install-smoke.php

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: install-smoke-${{ matrix.ref }}-${{ matrix.name }}-${{ matrix.kind }}
          path: |
            install-smoke.log
            ${{ runner.temp }}/psalm-install-smoke/composer.json
            ${{ runner.temp }}/psalm-install-smoke/composer.lock
            ${{ runner.temp }}/psalm-install-smoke/psalm.xml
          if-no-files-found: ignore
          retention-days: 14
