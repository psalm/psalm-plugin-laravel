name: Spelling

# Lints prose for typos in README, source, docs, and stubs.
# Catches typos before they ship to users as comments or documentation.

on:
  pull_request:
  push:
    branches:
      - master
      - "3.x"

permissions:
  contents: read

concurrency:
  group: spelling-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  typos:
    name: Check for typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for typos
        # Configuration lives in _typos.toml at the repo root.
        # Default path (.) scans the whole tree; vendor/build and other noise
        # are excluded via extend-exclude in _typos.toml.
        uses: crate-ci/typos@4d9c206a77c041268485162b8e2579ad7a5cb9a3 # v1.50.0
