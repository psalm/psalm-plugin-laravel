name: Spelling

# Lints prose for typos in README, source, docs, and stubs.
# Catches typos before they ship to users as comments or documentation.

on:
  pull_request:
  push:
    branches:
      - master
      - "3.x"

permissions:
  contents: read

concurrency:
  group: spelling-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  typos:
    name: Check for typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for typos
        # Configuration lives in _typos.toml at the repo root.
        # Default path (.) scans the whole tree; vendor/build and other noise
        # are excluded via extend-exclude in _typos.toml.
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0
