name: Tests

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '**.php'
      - '**.phpstub'
      - '**.phpt'
      - 'composer.json'
      - '.github/workflows/tests.yml'
      - 'bin/ci/check-phpt-conventions.sh'
  pull_request:
    paths:
      - '**.php'
      - '**.phpstub'
      - '**.phpt'
      - 'composer.json'
      - '.github/workflows/tests.yml'
      - 'bin/ci/check-phpt-conventions.sh'
  schedule:
    # Weekly on Friday at 06:00 UTC
    - cron: "0 6 * * 5"

# Cancel superseded runs on the same branch/PR to save CI minutes on fast pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  phpt_conventions:
    name: PHPT conventions
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check PHPT type-test conventions
        run: bash bin/ci/check-phpt-conventions.sh

  unit_tests:
    name: Unit test P${{ matrix.php }} | L${{ matrix.laravel || 'lockfile' }}
    runs-on: ubuntu-latest
    strategy:
      # Version-split fixtures fail per-cell by design; keep every cell's verdict visible.
      fail-fast: false
      matrix:
        include:
          # Lockfile cells cover both sides of the PHP 8.4/8.5 getMethods() initializer-order split.
          - php: '8.5'
          - php: '8.4'
          # Declared framework floors.
          - php: '8.4'
            laravel: '13.3.0'
          - php: '8.2'
            laravel: '12.14.0'
          # Highest 12.x: the enum $connection path is live since 12.28.
          - php: '8.2'
            laravel: '^12.14'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Check Composer configuration
        if: matrix.php == '8.4' && !matrix.laravel
        run: composer validate --strict

      - name: Install composer dependencies (lockfile)
        if: ${{ !matrix.laravel }}
        run: composer install

      - name: Install with Laravel constraint
        # Floors may have published advisories; this isolated test install is never deployed.
        if: matrix.laravel
        env:
          LARAVEL_CONSTRAINT: ${{ matrix.laravel }}
        run: >-
          composer update --with="laravel/framework:$LARAVEL_CONSTRAINT" --with-all-dependencies
          --no-interaction --no-progress --prefer-dist --prefer-stable --no-blocking --no-audit

      - name: Verify installed Laravel version
        if: matrix.laravel && !startsWith(matrix.laravel, '^')
        env:
          EXPECTED_LARAVEL: v${{ matrix.laravel }}
        run: >-
          php -r 'require "vendor/autoload.php";
          exit(Composer\InstalledVersions::getPrettyVersion("laravel/framework") === getenv("EXPECTED_LARAVEL") ? 0 : 1);'

      - name: Run Unit tests (lockfile)
        if: ${{ !matrix.laravel }}
        run: composer test:unit

      - name: Run Unit tests
        # Constraint installs may resolve PHPUnit 11 (Testbench 10), which lacks --display-phpunit-notices.
        if: matrix.laravel
        run: vendor/bin/phpunit --testsuite=unit --display-deprecations --display-notices


  type_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [ 8.5, 8.4, 8.3, 8.2 ]
        laravel: [ ^13.3, ^12.14 ]
        dependencies: [ highest ]
        exclude:
          - php: 8.2
            laravel: ^13.3
    name: Type test P${{ matrix.php }} | L${{ matrix.laravel }} | ${{ matrix.dependencies == 'highest' && '↑' || '↓' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=256M
          coverage: none
          tools: composer

      - name: Install dependencies from composer.json
        run: composer update --with="laravel/framework:${{ matrix.laravel }}" --no-interaction --no-progress --prefer-dist --prefer-stable ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

      - name: Run Psalm/Type tests
        run: composer test:type

  # This job doubles as the Phase 1 "drift canary" for the laravel/ai integration.
  # The version range in Plugin::optionalIntegrationStubs() has no upper ceiling
  # below 1.0 (a future minor's coverage must never be silently dropped just to
  # dodge a rare drift-caused false positive), so every run here installs
  # whatever laravel/ai release is newest, and the weekly schedule plus
  # workflow_dispatch trigger (inherited from the workflow-level `on:` block above)
  # already exercise that install on a cadence independent of PHP-file changes.
  #
  # What this catches: laravel/ai failing to install; a stubbed class being
  # renamed/removed (every PromptInjection phpt SKIPIFs on class presence, so
  # all-skipped trips the guard below); the plugin's own regressions; and, via
  # bin/ci/check-laravel-ai-stub-parity.php, a stubbed method's native
  # parameter/return type drifting on a laravel/ai release. That last one is
  # otherwise invisible: a registered stub overrides the vendor's reflected
  # signature for methods it declares, so Psalm itself never compares the two.
  # A small KNOWN_GAPS allowlist in that script covers pre-existing, separately
  # tracked mismatches so the job fails only on genuinely new drift.
  type_tests_laravel_ai:
    name: Type test (laravel/ai)
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: 8.4
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=256M
          coverage: none
          tools: composer

      - name: Install dependencies from composer.json
        run: composer install --no-interaction --no-progress --prefer-dist

      # laravel/ai is optional (not a root composer.json dependency, see #937) and requires PHP
      # ^8.3, so it is installed here rather than in composer.json to keep it off the PHP 8.2
      # lanes. This is the only leg where the PromptInjection PHPT suite actually runs.
      - name: Install optional laravel/ai integration
        run: composer require --dev "laravel/ai:>=0.10.0 <1.0.0" --no-interaction --no-progress

      - name: Check laravel/ai stub-vs-vendor signature parity
        # Psalm's registered stubs win over the real vendor class during analysis
        # (redeclaration is the declarative default for these stubs), so a stub whose
        # native parameter/return types drift from a newer laravel/ai release passes
        # every phpt and app-leg check below silently: Psalm never notices, because it
        # never looks at the vendor source once a stub claims the class. This step is
        # the missing check: it reflects the installed classes directly and diffs
        # native types against the stub source, independent of Psalm.
        run: php bin/ci/check-laravel-ai-stub-parity.php

      - name: Run Psalm/Type tests
        run: composer test:type -- --log-junit=/tmp/type-tests-junit.xml --no-progress

      - name: Report type-test failure against the newest laravel/ai
        # The type-test suite failed while running against the newest installed
        # laravel/ai release. This may be a plugin regression, or a stubbed class
        # renamed/removed upstream (the SKIPIF guard below would also catch that).
        # A stubbed method's native signature drifting is covered separately by the
        # parity check above, not by this suite: Psalm resolves calls here against
        # the stub, not the vendor, so this particular failure is not that.
        # Scroll up to the psalm-tester diff for the exact failing issue/class/line.
        if: failure()
        run: |
          echo "::error::Type-test suite failed against the newest installed laravel/ai release." \
            "See the psalm-tester diff above for the exact failure. Reproduce locally with:" \
            "composer require --dev 'laravel/ai:>=0.10.0 <1.0.0' && composer test:type"

      - name: Verify the PromptInjection phpt suite actually ran
        # Every PromptInjection phpt carries a --taint-analysis ARGS section and a
        # SKIPIF gate on laravel/ai class presence, so a run where the package failed
        # to install, or where the SKIPIF check itself drifted, SKIPs every phpt and
        # composer test:type still exits 0. A canary that goes silently green is worse
        # than no canary, so assert real execution instead of trusting the exit code
        # alone. Reads the JUnit log the previous step already produced rather than
        # running phpunit a second time: this repo's phpt runner batches every
        # discovered phpt through Psalm in setUpBeforeClass() regardless of PHPUnit's
        # --filter, so a filtered re-run pays the same ~1 minute for no benefit.
        run: php bin/ci/assert-tests-ran.php /tmp/type-tests-junit.xml PromptInjection
