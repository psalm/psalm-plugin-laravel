name: Tests

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '**.php'
      - '**.phpstub'
      - '**.phpt'
      - 'composer.json'
      - '.github/workflows/tests.yml'
      - 'bin/ci/check-phpt-conventions.sh'
  pull_request:
    paths:
      - '**.php'
      - '**.phpstub'
      - '**.phpt'
      - 'composer.json'
      - '.github/workflows/tests.yml'
      - 'bin/ci/check-phpt-conventions.sh'
  schedule:
    # Weekly on Friday at 06:00 UTC
    - cron: "0 6 * * 5"

# Cancel superseded runs on the same branch/PR to save CI minutes on fast pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  phpt_conventions:
    name: PHPT conventions
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check PHPT type-test conventions
        run: bash bin/ci/check-phpt-conventions.sh

  unit_tests:
    name: Unit test P${{ matrix.php }} | L${{ matrix.laravel || 'lockfile' }}
    runs-on: ubuntu-latest
    strategy:
      # Version-split fixtures fail per-cell by design; keep every cell's verdict visible.
      fail-fast: false
      matrix:
        include:
          # Lockfile cells cover both sides of the PHP 8.4/8.5 getMethods() initializer-order split.
          - php: '8.5'
          - php: '8.4'
          # Declared framework floors.
          - php: '8.4'
            laravel: '13.3.0'
          - php: '8.2'
            laravel: '12.14.0'
          # Highest 12.x: the enum $connection path is live since 12.28.
          - php: '8.2'
            laravel: '^12.14'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Check Composer configuration
        if: matrix.php == '8.4' && !matrix.laravel
        run: composer validate --strict

      - name: Install composer dependencies (lockfile)
        if: ${{ !matrix.laravel }}
        run: composer install

      - name: Install with Laravel constraint
        # Floors may have published advisories; this isolated test install is never deployed.
        if: matrix.laravel
        env:
          LARAVEL_CONSTRAINT: ${{ matrix.laravel }}
        run: >-
          composer update --with="laravel/framework:$LARAVEL_CONSTRAINT" --with-all-dependencies
          --no-interaction --no-progress --prefer-dist --prefer-stable --no-blocking --no-audit

      - name: Verify installed Laravel version
        if: matrix.laravel && !startsWith(matrix.laravel, '^')
        env:
          EXPECTED_LARAVEL: v${{ matrix.laravel }}
        run: >-
          php -r 'require "vendor/autoload.php";
          exit(Composer\InstalledVersions::getPrettyVersion("laravel/framework") === getenv("EXPECTED_LARAVEL") ? 0 : 1);'

      - name: Run Unit tests (lockfile)
        if: ${{ !matrix.laravel }}
        run: composer test:unit

      - name: Run Unit tests
        # Constraint installs may resolve PHPUnit 11 (Testbench 10), which lacks --display-phpunit-notices.
        if: matrix.laravel
        run: vendor/bin/phpunit --testsuite=unit --display-deprecations --display-notices


  type_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [ 8.5, 8.4, 8.3, 8.2 ]
        laravel: [ ^13.3, ^12.14 ]
        dependencies: [ highest ]
        exclude:
          - php: 8.2
            laravel: ^13.3
    name: Type test P${{ matrix.php }} | L${{ matrix.laravel }} | ${{ matrix.dependencies == 'highest' && '↑' || '↓' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=256M
          coverage: none
          tools: composer

      - name: Install dependencies from composer.json
        run: composer update --with="laravel/framework:${{ matrix.laravel }}" --no-interaction --no-progress --prefer-dist --prefer-stable ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

      - name: Run Psalm/Type tests
        run: composer test:type

  # This job doubles as the Phase 1 "drift canary" for the laravel/ai integration
  # (design: .alies/docs/design-laravel-ai-taint.md, mechanism M1). The version range
  # in Plugin::optionalIntegrationStubs() has no upper ceiling below 1.0, so every run
  # here installs whatever laravel/ai release is newest, and the weekly schedule plus
  # workflow_dispatch trigger (inherited from the workflow-level `on:` block above)
  # already exercise that install on a cadence independent of PHP-file changes.
  type_tests_laravel_ai:
    name: Type test (laravel/ai)
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: 8.4
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=256M
          coverage: none
          tools: composer

      - name: Install dependencies from composer.json
        run: composer install --no-interaction --no-progress --prefer-dist

      # laravel/ai is optional (not a root composer.json dependency, see #937) and requires PHP
      # ^8.3, so it is installed here rather than in composer.json to keep it off the PHP 8.2
      # lanes. This is the only leg where the PromptInjection PHPT suite actually runs.
      - name: Install optional laravel/ai integration
        run: composer require --dev "laravel/ai:>=0.10.0 <1.0.0" --no-interaction --no-progress

      - name: Run Psalm/Type tests
        run: composer test:type

      - name: Report laravel/ai signature drift
        # composer test:type already fails loudly here: a stub/handler mismatch surfaces
        # as a psalm-tester unified diff naming the exact issue, class, method, and line
        # (see the "Failed asserting that string matches format description" block above).
        # This banner just makes that alarm impossible to miss among the rest of CI.
        if: failure()
        run: |
          echo "::error::laravel/ai signature drift suspected. The 'Run Psalm/Type tests' step above failed" \
            "while running against the newest installed laravel/ai release. Scroll up to the psalm-tester" \
            "diff for the exact drifted class/method/issue, or reproduce locally with:" \
            "composer require --dev 'laravel/ai:>=0.10.0 <1.0.0' && composer test:type"

      - name: Verify the PromptInjection phpt suite actually ran
        # M6/M5 (design: .alies/docs/design-laravel-ai-taint.md): every PromptInjection phpt
        # carries a --taint-analysis ARGS section and a SKIPIF gate on laravel/ai class
        # presence, so a run where the package failed to install, or where the SKIPIF check
        # itself drifted, SKIPs every phpt and composer test:type still exits 0. A canary
        # that goes silently green is worse than no canary, so assert real execution
        # instead of trusting the exit code alone.
        run: |
          vendor/bin/phpunit --testsuite=type --filter=PromptInjection --no-progress \
            --log-junit=/tmp/prompt-injection-junit.xml

          SUMMARY=$(grep -m1 '<testsuite ' /tmp/prompt-injection-junit.xml)
          TESTS=$(echo "$SUMMARY" | grep -oP 'tests="\K[0-9]+')
          SKIPPED=$(echo "$SUMMARY" | grep -oP 'skipped="\K[0-9]+')
          echo "PromptInjection suite: ${TESTS} tests, ${SKIPPED} skipped"

          if [ -z "$TESTS" ] || [ "$TESTS" -eq 0 ]; then
            echo "::error::No PromptInjection phpt tests were collected. The --filter pattern or" \
              "tests/Type/tests/PromptInjection/ layout may have changed."
            exit 1
          fi
          if [ "$SKIPPED" -ge "$TESTS" ]; then
            echo "::error::Every PromptInjection phpt was skipped (${SKIPPED}/${TESTS}). laravel/ai" \
              "likely failed to install, or every SKIPIF class-presence guard is stale. This run is" \
              "NOT exercising taint coverage."
            exit 1
          fi
          if [ "$SKIPPED" -gt 0 ]; then
            echo "::warning::${SKIPPED}/${TESTS} PromptInjection phpts skipped. Check their SKIPIF" \
              "conditions against the installed laravel/ai version."
          fi
