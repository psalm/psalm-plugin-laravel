name: Release Drafter

on:
  workflow_dispatch:
  push:
    # Draft releases only for the latest major (4.x). The 3.x branch is a
    # separate major line and is released/tagged manually, not drafted here.
    branches:
      - "4.x"

permissions:
  contents: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # required to draft releases
      pull-requests: read   # required for autolabeler input
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Drafts your next Release notes as Pull Requests are merged into "4.x"
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7
        with:
          # (Optional) specify config name to use, relative to .github/. Default: release-drafter.yml
          config-name: config/release-drafter.yml
          token: ${{ secrets.GITHUB_TOKEN }}
