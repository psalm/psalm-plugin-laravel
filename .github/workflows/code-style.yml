name: Code Style

on:
  push:
    branches: [4.x]
    paths:
      - '**.php'
      - 'composer.json'
  pull_request:
    paths:
      - '**.php'
      - 'composer.json'

# Cancel superseded runs on the same branch/PR to save CI minutes on fast pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Psalm requires `psalm/plugin-laravel: ^4.17.4`. A checkout has no tag, so Composer guesses a root
  # version that fails that constraint and silently resolves an older Psalm without template defaults
  # (composer.json `conflict` turns that into a solve error). Stating the branch version keeps the root
  # a valid 4.x.
  COMPOSER_ROOT_VERSION: 4.x-dev

jobs:
  fix:
    name: Auto-fix code style
    # Skip fork PRs — GITHUB_TOKEN can't push to external forks.
    # Fork contributors: run `composer rector && composer cs` locally.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write  # git-auto-commit-action pushes the style fix back to the branch
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to immutable SHA, not branch name, to close TOCTOU window
          # from a force-push landing mid-run between checkout and commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.5
          coverage: none
          tools: cs2pr

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest --no-interaction

      - name: Rector
        run: composer rector

      - name: PHP CS Fixer
        run: composer cs

      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          commit_message: 'style: auto-fix (rector + php-cs-fixer)'
          commit_author: 'GitHub Actions <actions@github.com>'
          # Explicit branch is required because we checked out a detached SHA.
          branch: ${{ github.head_ref || github.ref_name }}

  check:
    name: Verify code style (forks)
    # Only run the check job on fork PRs where we can't auto-fix.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.5
          coverage: none

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest --no-interaction

      - name: Rector (dry-run)
        run: composer rector:dry

      - name: PHP CS check
        run: composer cs:check
