name: Test Laravel app

on:
  workflow_dispatch:
  push:
    branches: [4.x]
    paths:
      - '**.php'
      - '**.phpstub'
      - 'composer.json'
      - 'tests/Application/laravel*'
      - '.github/workflows/test-laravel-app.yml'
  pull_request:
    paths:
      - '**.php'
      - '**.phpstub'
      - 'composer.json'
      - 'tests/Application/laravel*'
      - '.github/workflows/test-laravel-app.yml'
  schedule:
    # Weekly on Friday at 06:00 UTC
    - cron: "0 6 * * 5"

# Cancel superseded runs on the same branch/PR to save CI minutes on fast pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The PHP 8.5 cell doubles as a fresh-app canary for the laravel/ai integration:
# laravel-test.sh installs the newest release satisfying `>=1.0.0 <2.0.0`, the
# plugin's supported range (1.0.0 floor; the 2.0 ceiling is excluded because that
# unsupported major has no compatibility coverage). The weekly schedule and
# workflow_dispatch trigger above already run this independently of which files
# changed.
#
# Like the PromptInjection suite in tests.yml, this catches laravel/ai failing to
# install and the plugin's own regressions, but NOT a stubbed method's native
# signature drifting on a laravel/ai release: this leg runs through the registered
# stubs, which override the vendor's reflected signature for methods they declare,
# so Psalm never compares the two here either. Tracked
# separately: psalm/psalm-plugin-laravel#1331.
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/.composer-cache
    name: Test Laravel ${{ matrix.laravel-installer-version }} (PHP ${{ matrix.php-version }})

    strategy:
      fail-fast: true
      matrix:
        include:
          # Oldest PHP with the pinned old installer, and newest PHP with the dev-master installer.
          - php-version: '8.2'
            laravel-installer-version: '12.12.2'
          - php-version: '8.5'
            laravel-installer-version: 'dev-master'

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      # Composer downloads only (never vendor/ or the generated app). PRs restore the newest
      # default-branch snapshot; only the default branch writes one. Same scheme as psalm.yml.
      - name: Restore Composer downloads
        id: composer-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: composer-${{ runner.os }}-php${{ matrix.php-version }}-installer-${{ matrix.laravel-installer-version }}-${{ hashFiles('composer.json') }}-${{ github.sha }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php-version }}-installer-${{ matrix.laravel-installer-version }}-${{ hashFiles('composer.json') }}-

      - name: Build a Laravel project and run Psalm on it
        run: |
          LARAVEL_INSTALLER_VERSION=${{ matrix.laravel-installer-version }} ./tests/Application/laravel-test.sh --verbose

      - name: Save Composer downloads
        if: ${{ github.ref_name == github.event.repository.default_branch && steps.composer-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: ${{ steps.composer-cache.outputs.cache-primary-key }}

      - run: |
          echo "Psalm analysis failed on a fresh Laravel project. Please consider updating baseline: tests/Application/laravel-test-psalm-baseline.xml"
        if: ${{ failure() }}

      - name: Report fresh-app failure against the newest supported laravel/ai
        # Only the PHP >= 8.3 cell installs laravel/ai (tests/Application/laravel-test.sh
        # gates the install on the same check). This cell resolves the newest release
        # within the supported `>=1.0.0 <2.0.0` gate, so a failure here may be a plugin regression
        # rather than something specific to this app fixture. It is NOT proof of a
        # stubbed method's native signature drifting: this leg resolves calls through
        # the same registered stubs as the phpt suite, so that class of drift stays
        # invisible here too (psalm/psalm-plugin-laravel#1331). Scroll up to the compact
        # psalm output for the exact failing issue/class/line.
        if: ${{ failure() && matrix.php-version != '8.2' }}
        env:
          LARAVEL_INSTALLER_VERSION: ${{ matrix.laravel-installer-version }}
        run: |
          echo "::error::Fresh-app Psalm analysis failed against the newest supported" \
            "laravel/ai 1.x release. See the compact output above for the exact failure." \
            "Reproduce locally with:" \
            "LARAVEL_INSTALLER_VERSION=$LARAVEL_INSTALLER_VERSION ./tests/Application/laravel-test.sh --verbose"
