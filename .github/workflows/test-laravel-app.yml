name: Test Laravel app

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '**.php'
      - '**.phpstub'
      - 'composer.json'
      - 'tests/Application/laravel*'
      - '.github/workflows/test-laravel-app.yml'
  pull_request:
    paths:
      - '**.php'
      - '**.phpstub'
      - 'composer.json'
      - 'tests/Application/laravel*'
      - '.github/workflows/test-laravel-app.yml'
  schedule:
    # Weekly on Friday at 06:00 UTC
    - cron: "0 6 * * 5"

# Cancel superseded runs on the same branch/PR to save CI minutes on fast pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The PHP >= 8.3 cells double as the Phase 1 "drift canary" for the laravel/ai integration:
# laravel-test.sh installs laravel/ai with no upper version ceiling below 1.0 (a future
# minor's coverage must never be silently dropped just to dodge a rare drift-caused false
# positive), so these cells always pull the newest release. The weekly schedule and
# workflow_dispatch trigger above already run this independent of which files changed.
#
# Like the PromptInjection suite in tests.yml, this catches laravel/ai failing to install
# and the plugin's own regressions, but NOT a stubbed method's native signature drifting on
# a laravel/ai release: this leg runs through the same registered stubs, which override the
# vendor's reflected signature for methods they declare, so Psalm never compares the two
# here either. Tracked separately: psalm/psalm-plugin-laravel#1331.
jobs:
  build:
    runs-on: ubuntu-latest
    name: Test Laravel ${{ matrix.laravel-installer-version }} (PHP ${{ matrix.php-version }})

    strategy:
      fail-fast: true
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        laravel-installer-version:
          - '12.12.2'
          - 'dev-master'
        exclude:
          - php-version: '8.2'
            laravel-installer-version: 'dev-master'

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Build a Laravel project and run Psalm on it
        run: |
          LARAVEL_INSTALLER_VERSION=${{ matrix.laravel-installer-version }} ./tests/Application/laravel-test.sh --verbose

      - run: |
          echo "Psalm analysis failed on a fresh Laravel project. Please consider updating baseline: tests/Application/laravel-test-psalm-baseline.xml"
        if: ${{ failure() }}

      - name: Report fresh-app failure against the newest laravel/ai
        # Only the PHP >= 8.3 cells install laravel/ai (tests/Application/laravel-test.sh
        # gates the install on the same check). This cell installs the newest available
        # release (no upper version ceiling below 1.0), so a failure here may be a plugin
        # regression rather than something specific to this app fixture. It is NOT proof
        # of a stubbed method's native signature drifting: this leg resolves calls through
        # the same registered stubs as the phpt suite, so that class of drift stays
        # invisible here too (psalm/psalm-plugin-laravel#1331). Scroll up to the compact
        # psalm output for the exact failing issue/class/line.
        if: ${{ failure() && contains(fromJSON('["8.3", "8.4", "8.5"]'), matrix.php-version) }}
        env:
          LARAVEL_INSTALLER_VERSION: ${{ matrix.laravel-installer-version }}
        run: |
          echo "::error::Fresh-app Psalm analysis failed against the newest installed" \
            "laravel/ai release. See the compact output above for the exact failure." \
            "Reproduce locally with:" \
            "LARAVEL_INSTALLER_VERSION=$LARAVEL_INSTALLER_VERSION ./tests/Application/laravel-test.sh --verbose"
