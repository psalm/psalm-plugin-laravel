# poutine config, auto-discovered at .github/poutine.yml (poutine >= 1.1.4).
skip:
  # Not on the verified-creator list bundled with poutine 1.1.4. Each one is reviewed, widely used,
  # and pinned by SHA. astral-sh is verified in later poutine releases.
  # A purl without a version matches every pinned ref of that action.
  - rule: github_action_from_unverified_creator_used
    purl:
      - pkg:githubactions/astral-sh/setup-uv
      - pkg:githubactions/benchmark-action/github-action-benchmark
      - pkg:githubactions/crate-ci/typos
      - pkg:githubactions/shivammathur/setup-php
      - pkg:githubactions/stefanzweifel/git-auto-commit-action
      - pkg:githubactions/synacktiv/action-octoscan
  # psalm-delta runs PR code by design: maintainer-gated `/psalm-delta`, contents:read, no secrets,
  # persist-credentials:false, forks never save cache (see the header of psalm-delta.yml). The
  # write-token job that could consume a poisoned cache (benchmark publish) restores no caches.
  - rule: untrusted_checkout_exec
    path: .github/workflows/psalm-delta.yml
