# @see https://github.com/release-drafter/release-drafter

name-template: '$RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
# Collect changes from 4.x history only.
commitish: refs/heads/4.x
# Pick the previous release by version, not by `target_commitish`: a release
# published against a SHA (e.g. v4.19.0) is invisible to `filter-by-commitish`,
# so the draft fell back to an older tag. The range keeps 3.x tags out.
filter-by-range: '^4.0.0'
categories:
  - title: 'Removed'
    labels:
      - 'release:removed'
  - title: 'Deprecations'
    labels:
      - 'release:deprecation'
  - title: 'Features'
    labels:
      - 'release:feature'
  - title: 'Fixes'
    labels:
      - 'release:fix'
  - title: 'Docs'
    labels:
      - 'release:docs'
  - title: 'Internal changes'
    labels:
      - 'release:internal'
      - 'chore'
  - title: 'Typos'
    labels:
      - 'release:typo'
exclude-labels:
  - 'release:skip-changelog'
category-template: '### $TITLE'
change-template: '- $TITLE (#$NUMBER) @$AUTHOR '
version-template: 'v$MAJOR.$MINOR.$PATCH'
version-resolver:
  major:
    labels:
      - 'release:major'
  minor:
    labels:
      - 'release:minor'
  patch:
    labels:
      - 'release:patch'
  default: patch
template: |
  ## What’s Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_VERSION
