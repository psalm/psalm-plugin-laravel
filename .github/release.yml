# @see https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - 'release:skip-changelog'
  categories:
    - title: Removed
      labels:
        - 'release:removed'
    - title: Deprecations
      labels:
        - 'release:deprecation'
    - title: Features
      labels:
        - 'release:feature'
    - title: Fixes
      labels:
        - 'release:fix'
    - title: Docs
      labels:
        - 'release:docs'
    - title: Internal changes
      labels:
        - 'release:internal'
        - 'chore'
    - title: Typos
      labels:
        - 'release:typo'
    - title: Other changes
      labels:
        - '*'
