# Generated by `psalm-laravel add github` (re-run with --force to update).
# Psalm 7 runs type and taint analysis in a single pass:
#  - type analysis fails on Psalm's exit code;
#  - taint analysis uploads SARIF to Code Scanning and fails on findings.

name: Psalm

on:
  push:
    branches: [ main ]
  pull_request:

# Nothing is granted workflow-wide; the one job below asks for what it needs.
permissions: {}

env:
  # Pin your project's PHP version here, not in the setup-php step: the cache key below
  # carries it too, so a version bump starts a fresh cache instead of reusing entries
  # serialised by another runtime.
  PSALM_PHP_VERSION: '8.4'

  # Psalm forces a single thread whenever it detects CI, and it decides the scan phase and
  # the analysis phase separately: --threads covers analysis only, --scan-threads covers
  # scanning (Cli\Psalm::getThreads()). Both must be set or half the run stays serial.
  # On a 7,600-file Laravel codebase a fully single-threaded run measured 177s against 47s.
  #
  # Plain numbers rather than $(nproc): nproc does not exist on macOS runners, Windows
  # runners default to PowerShell, and inside a container coreutils older than 9.8 reports
  # the host's cores rather than the cgroup quota, which over-subscribes and can OOM.
  # 4 matches ubuntu-latest. Raise both to your runner's core count.
  #
  # On many-core runners the analysis optimum sits slightly below the core count, because
  # the per-worker merge grows as the analysis shrinks: on 16 cores, 12 beat 16.
  #
  # Scan threads pay off on a cold cache and are neutral to slightly negative on a warm one,
  # where the parse work they parallelise is already done. At 4 the warm-run cost is noise;
  # if you raise the analysis count on a large runner, sweep this one separately.
  PSALM_THREADS: 4
  PSALM_SCAN_THREADS: 4

concurrency:
  group: psalm-${{ github.ref }}
  # Pull requests supersede freely. Default-branch runs do not: cancelling one loses the
  # cache generation every later pull request restores from (see the save step below).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  psalm:
    name: Psalm static analysis (types + taint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Drop this (and the upload-sarif step) if the repository has no Code Scanning.
      security-events: write
    # A wedged analysis should fail loudly, not bill six hours against the default limit.
    timeout-minutes: 15
    steps:
      - name: Block unexpected egress
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # Covers checkout, setup-php, Composer (public Packagist) and the SARIF upload. Extend for other hosts
          # (private registry, VCS repos, extra plugins). Use egress-policy: audit to discover them.
          #
          # The Actions cache hosts are deliberately absent: harden-runner resolves the cache blob
          # host itself in block mode and appends it, and its agent allows the cache endpoints
          # implicitly when that lookup fails. Listing them here is neither needed nor sufficient
          # (the blob host is drawn from a numbered pool that rotates per run).
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            packagist.org:443
            release-assets.githubusercontent.com:443
            repo.packagist.org:443
            results-receiver.actions.githubusercontent.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PSALM_PHP_VERSION }}
          coverage: none
          # igbinary is worth installing purely for Psalm: its ForkContext serialises each
          # worker's results back to the parent with it when present, and falls back to
          # PHP's native serializer when it is not. On a large codebase that difference
          # measured as roughly 50s versus 6s in the thread-merge phase.
          #
          # It also selects the cache serializer, which Psalm folds into the hash naming each
          # cache generation directory. Adding or removing it invalidates existing caches once.
          extensions: igbinary

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      # Psalm's cache holds parsed statements plus file and class-like storage. Restoring it
      # removes most of the scan phase, the largest single win available here: measured on a
      # 7,600-file Laravel codebase, scan went 90.9s to 18.7s and the whole run 158s to 78s.
      #
      # Restored after Composer so the key can hash the installed composer.lock. Psalm folds
      # that file's contents, your psalm.xml and the mtimes of its own vendor sources into the
      # hash naming each cache generation directory, so an entry built from a different lock
      # misses internally in every subcache while still costing the download. The restore-keys
      # fallback therefore repeats that hash verbatim and varies only the per-commit part; a
      # bare `psalm-` catch-all would fire precisely when the archive is unusable.
      #
      # ~/.cache/psalm is Psalm's default on Linux (XDG home cache). Point this at your own
      # path if psalm.xml sets cacheDirectory.
      - name: Restore Psalm's cache
        id: psalm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/psalm
          key: psalm-${{ runner.os }}-php${{ env.PSALM_PHP_VERSION }}-${{ hashFiles('psalm.xml', 'composer.lock') }}-${{ github.sha }}
          restore-keys: |
            psalm-${{ runner.os }}-php${{ env.PSALM_PHP_VERSION }}-${{ hashFiles('psalm.xml', 'composer.lock') }}-

      # One pass = type + taint. Psalm 7 runs taint analysis by default (no --taint-analysis flag needed),
      # so a plain run emits both type and taint findings: GitHub annotations on stdout + a SARIF report.
      # Exits 0 even on findings; a real crash exits non-zero, fails this step, and skips the rest.
      # The CI single-thread default dates from 2019 (vimeo/psalm#2795) and is being
      # reconsidered upstream (vimeo/psalm#11761). Until then both flags are needed; see
      # the env block at the top of this file.
      #
      # Read as shell variables rather than interpolated as ${{ env.* }}: workflow scanners
      # (octoscan) cannot tell a literal workflow-level env from an attacker-reachable one and
      # flag every ${{ env.* }} that reaches a run: block as an expression-injection sink.
      - name: Run Psalm
        run: >-
          ./vendor/bin/psalm
          --threads="$PSALM_THREADS"
          --scan-threads="$PSALM_SCAN_THREADS"
          --report=psalm.sarif --report-show-info=false

      # Split from the restore rather than one combined actions/cache step: a combined step skips
      # its save on a key hit, so a snapshot whose key does not move never rolls forward. The key
      # carries github.sha, so every default-branch commit writes a fresh generation.
      #
      # Only the default branch writes. Pull request entries land under refs/pull/<n>/merge, which
      # nothing else can read, and would spend the repository's cache budget for one run's benefit;
      # restore-keys already lets a pull request fall back to the newest default-branch snapshot.
      #
      # !cancelled() rather than the implicit success(): Psalm validates every entry against a
      # per-file content hash on read, so a run that reported findings still leaves a correct cache,
      # and a red default branch must not stop refreshing what pull requests restore from.
      - name: Save Psalm's cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.psalm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/psalm
          key: ${{ steps.psalm-cache.outputs.cache-primary-key }}

      # Skipped on fork and Dependabot PRs: GitHub caps their GITHUB_TOKEN at read-only, so the upload
      # would fail with "Resource not accessible by integration" despite `security-events: write` above.
      # The "Fail on Psalm findings" step below still runs — findings block those PRs via annotations + exit code.
      - name: Upload SARIF to GitHub Code Scanning
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: psalm.sarif
          category: psalm

      # Fail on any error-level finding (taint = always error; type errors depend on your psalm.xml errorLevel).
      # Psalm exits 0 even on findings when it writes a report inside GitHub Actions (vimeo/psalm@6e39c24),
      # so CI is failed from the SARIF after upload, not from the exit code. Upload first so findings are recorded even on a failing run.
      - name: Fail on Psalm findings
        run: |
          errors=$(jq '[.runs[].results[] | select(.level == "error")] | length' psalm.sarif)
          echo "Psalm error-level findings: $errors"
          if [ "$errors" -gt 0 ]; then
            echo "::error::Psalm reported $errors error-level finding(s). See annotations on Files changed (maintainers: Security > Code scanning)."
            exit 1
          fi
